conditioning:
  method: pgdm
  params:
    scale: 1.05

data:
  name: ffhq # choices: ffhq, bedroom, cat, celeba-hq
  root: ./data/samples/ # address to put the associated images

measurement:
  operator:
    name: denoise
    in_shape: !!python/tuple [1, 3, 256, 256]
  
  noise: 
    name: gaussian
    sigma: 0.5
