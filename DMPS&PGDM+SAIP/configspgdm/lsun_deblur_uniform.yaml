conditioning:
  method: pgdm
  params:
    scale: 0.8

data:
  name: bedroom # choices: ffhq, bedroom, cat, celeba-hq
  root: ./data/samples_bedroom/ # address to put the associated images
measurement:
  operator:
    name: deblur
    type: uniform
    kernel_size: 9
    intensity: 3.0
  
  noise: 
    name: gaussian
    sigma: 0.05
